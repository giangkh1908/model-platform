[project]
name = "model-platform"
version = "2.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
# E/F: lỗi cơ bản, I: thứ tự import, B: lỗi dễ gặp, UP: cú pháp Python mới
select = ["E", "F", "I", "B", "UP"]
# B905: zip() không cần strict ở đây; thêm strict=True sẽ đổi hành vi khi hai danh sách lệch độ dài.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # để `pytest` (không qua python -m) vẫn import được backend
addopts = "-q"
