# CI: mỗi lần push lên main hoặc mở/cập nhật pull request thì kiểm tra backend và frontend.
# Chạy trên máy Linux miễn phí của GitHub, không cần GPU hay WSL (test không gọi model thật).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

# Push mới vào cùng nhánh thì huỷ lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (typecheck + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
